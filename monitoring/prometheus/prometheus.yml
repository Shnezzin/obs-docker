global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # OBS Container metrics
  - job_name: 'obs-container'
    static_configs:
      - targets: ['obs-studio-container:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Custom OBS metrics
  - job_name: 'obs-custom-metrics'
    static_configs:
      - targets: ['obs-studio-container:9091']
    metrics_path: '/obs-metrics'
    scrape_interval: 5s
