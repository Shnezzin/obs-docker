services:
  obs-studio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - OBS_VERSION=${OBS_VERSION:-31.1.1}
        - UBUNTU_VERSION=${UBUNTU_VERSION:-24.04}
        - LOCALE=${LOCALE:-en_US.UTF-8}
        - TIMEZONE=${TIMEZONE:-UTC}
        - ADDITIONAL_APT_GET_OPTS=--no-install-recommends
    container_name: obs-studio-container
    restart: unless-stopped
    
    ports:
      - "3389:3389"  # RDP port
            - "8080:8080"  # HTTP port
      - "8443:8443"  # HTTPS port
    
    volumes:
      - ./home:/home:rw
      - obs-config:/opt/obs-config
      - ./web/ssl:/app/ssl
    
    environment:
      - USER=${OBS_USER:-developer}
      - PASSWD=${OBS_PASSWD:?OBS_PASSWD environment variable is not set}
      - GROUP=${OBS_GROUP:-developer}
      - DISPLAY=:1
      - TZ=${TIMEZONE:-UTC}
      - LANG=${LOCALE:-en_US.UTF-8}
      - FLASK_ENV=production
      - SSL_CERT_PATH=/app/ssl/cert.pem
      - SSL_KEY_PATH=/app/ssl/key.pem
      - PYTHONPATH=/app
    
    # Health check to ensure services are running
    healthcheck:
      test: ["CMD", "pgrep", "-f", "xrdp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # Resource limits (adjusted for modern systems)
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    
    working_dir: /app
    command: >
      sh -c "mkdir -p /app/ssl && \
      openssl req -x509 -newkey rsa:4096 -nodes -out /app/ssl/cert.pem -keyout /app/ssl/key.pem \
      -days 365 -subj \"/C=DE/ST=NRW/L=Koeln/O=OBS-Docker/CN=localhost\" && \
      cd /app && \
      python -m gunicorn --worker-class eventlet -w 1 -b 0.0.0.0:8080 web.app:app"

volumes:
  obs-config:
    driver: local